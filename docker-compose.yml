services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rjif
      MYSQL_USER: rjif_app
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "3306:3306"
    volumes:
      - rjif_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  rjif_mysql:
