name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rjif_test
          MYSQL_USER: rjif_app
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters
      PASS_SIGNING_KEYS: v1:ci-pass-signing-secret-that-is-different-and-long
      ACTIVE_PASS_SIGNING_KEY: v1
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: rjif_test
      DB_USER: rjif_app
      DB_PASSWORD: test-password
      PUBLIC_ORIGIN: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate -w server
      - run: npm run seed -w server
      - run: npm run lint
      - run: npm test
      - run: npm run build
